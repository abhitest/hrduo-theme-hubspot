<div class="{{ name }} baseModuleStyle switchingTCSection {{ module.custom_style.custom_class }} " id="{{ module.custom_style.section_id }}">
  <div class="switchingTCShape">
    <svg  width="1400" height="230" viewBox="0 0 1400 230" fill="none">
<g opacity="0.75" filter="url(#filter0_f_6003_1832)">
<circle cx="889" cy="57" r="218" fill="#6347FF"/>
</g>
<g opacity="0.75" filter="url(#filter1_f_6003_1832)">
<circle cx="512" cy="377" r="218" fill="#6347FF"/>
</g>
<defs>
<filter id="filter0_f_6003_1832" x="171" y="-661" width="1436" height="1436" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix"/>
<feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
<feGaussianBlur stdDeviation="250" result="effect1_foregroundBlur_6003_1832"/>
</filter>
<filter id="filter1_f_6003_1832" x="-206" y="-341" width="1436" height="1436" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix"/>
<feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
<feGaussianBlur stdDeviation="250" result="effect1_foregroundBlur_6003_1832"/>
</filter>
</defs>
</svg>
  </div>
  <span class="baseModuleOverlay"></span>
  <div class="baseModuleParent"> 
    <div class="content-wrapper">
      {# Custum Width Option #}
      <div class="customWidthOption switchingTCInSec text-center white_color">
        {% if  module.content_group.title  %}
        <div class="moduleTitle switchingTCTitle">
          {{ module.content_group.title }}
        </div>
          {% endif %}
          {% if module.content_group.content %}
          <div class="moduleContent pt20 switchingTCContent medium">
            {{ module.content_group.content }}
          </div>
          {% endif %}
      </div>
          {# End Custum Width Option #}



    </div>
  </div>

</div>

    {% require_css %}
    
    <style>

{#       {% scope_css %} #}
        
      {# Desktop Styling #}
      .{{name}}.baseModuleStyle{
        position:relative;
      
        {{ module.style.spacing.desktop_spacing.css }}
       
        {% if module.style.background_property.background_choice == 'bgImage'  %}
         background-image:url('{{ module.style.background_property.background_image.src|escape_url }}');  background-position: center center;  background-repeat: no-repeat; background-size : cover;
        {% elif module.style.background_property.background_choice == 'bgColor'  %}
        background-color:rgba({{ module.style.background_property.background_color.color|convert_rgb }},{{ module.style.background_property.background_color.opacity }}%);
        {% elif module.style.background_property.background_choice == 'gredient'  %}
        background:{{ module.style.background_property.background_gredient.css }};
        {% endif %}
         margin-left : 20px;margin-right: 20px; border-radius : 30px;
      } 
      /****  Overlay Start  *****/
      {% if module.style.background_property.background_choice == 'bgImage'  %}
      .{{name}} .baseModuleOverlay{ position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-color:rgba({{ module.style.background_property.overlay_color.color|convert_rgb }},{{ module.style.background_property.overlay_color.opacity }}%); }
      {% endif %}
      /****  Overlay Start  *****/
      .{{name}} .baseModuleParent{position:relative; z-index:5}



      {# End Desktop Styling #}

      {# Tablet Styling #}
      @media(max-width:1300px){
        .{{name}}.baseModuleStyle{
           {{  module.style.spacing.tab_spacing.css }}
        } 
      }
      {# End Tablet Styling #}
      {# Mobile Styling #}
      @media(max-width:767px){
        .{{name}}.baseModuleStyle{
          {{ module.style.spacing.mobile_spacing.css  }}
           margin-left : 10px;margin-right: 10px;
        } 
      }
      
{#       {% end_scope_css %} #}
    </style>
  {% end_require_css %}
